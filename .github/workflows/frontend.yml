name: frontend-build
on: [ push ]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18'
      
      - name: Install dependencies and build
      - run: npm install
      - run: npm run build --if-present